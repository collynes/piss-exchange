<svg viewBox="0 0 1440 1980" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1440" height="1980" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#000000"/>
    </marker>
    <style>text{stroke:none;fill:#000000;}</style>
  </defs>

<text x="720.0" y="55" text-anchor="middle" font-size="27" font-weight="bold">FIGURE 2 — TWO-PHASE ATOMIC STOCK RESERVATION FLOW</text>
<g stroke="#000000" stroke-width="2.5" fill="none" font-size="18">
<rect x="20.0" y="130" width="260" height="92" fill="#ffffff" stroke-width="2.5"/>
<text x="150" y="160" text-anchor="middle" font-weight="bold" font-size="20">BUYER</text>
<text x="150" y="186" text-anchor="middle" font-weight="bold" font-size="20">CLIENT</text>
<text x="150" y="216" text-anchor="middle" font-size="18">200</text>
<line x1="150" y1="222" x2="150" y2="1900" stroke-dasharray="7,5" stroke-width="2"/>
<rect x="320.0" y="130" width="260" height="92" fill="#ffffff" stroke-width="2.5"/>
<text x="450" y="160" text-anchor="middle" font-weight="bold" font-size="20">ORDER</text>
<text x="450" y="186" text-anchor="middle" font-weight="bold" font-size="20">API ROUTE</text>
<text x="450" y="216" text-anchor="middle" font-size="18">202</text>
<line x1="450" y1="222" x2="450" y2="1900" stroke-dasharray="7,5" stroke-width="2"/>
<rect x="620.0" y="130" width="260" height="92" fill="#ffffff" stroke-width="2.5"/>
<text x="750" y="160" text-anchor="middle" font-weight="bold" font-size="20">PAYMENT</text>
<text x="750" y="186" text-anchor="middle" font-weight="bold" font-size="20">API ROUTE</text>
<text x="750" y="216" text-anchor="middle" font-size="18">204</text>
<line x1="750" y1="222" x2="750" y2="1900" stroke-dasharray="7,5" stroke-width="2"/>
<rect x="920.0" y="130" width="260" height="92" fill="#ffffff" stroke-width="2.5"/>
<text x="1050" y="160" text-anchor="middle" font-weight="bold" font-size="20">INVENTORY</text>
<text x="1050" y="186" text-anchor="middle" font-weight="bold" font-size="20">RESERVATION MODULE</text>
<text x="1050" y="216" text-anchor="middle" font-size="18">206</text>
<line x1="1050" y1="222" x2="1050" y2="1900" stroke-dasharray="7,5" stroke-width="2"/>
<rect x="1220.0" y="130" width="260" height="92" fill="#ffffff" stroke-width="2.5"/>
<text x="1350" y="160" text-anchor="middle" font-weight="bold" font-size="20">M-PESA</text>
<text x="1350" y="186" text-anchor="middle" font-weight="bold" font-size="20">GATEWAY</text>
<text x="1350" y="216" text-anchor="middle" font-size="18">208</text>
<line x1="1350" y1="222" x2="1350" y2="1900" stroke-dasharray="7,5" stroke-width="2"/>
<rect x="80" y="640" width="1170" height="480" stroke-dasharray="8,5" stroke-width="2"/>
<text x="92" y="666" font-size="17" font-style="italic">reservation transaction</text>
<line x1="150" y1="280" x2="450" y2="280"  marker-end="url(#arrow)"/>
<text x="300.0" y="244" text-anchor="middle" font-size="18">1. request transaction creation</text>
<text x="300.0" y="268" text-anchor="middle" font-size="18">(offer identifier, quantity)</text>
<path d="M450,380 C 540,374 540,410 450,406"  marker-end="url(#arrow)"/>
<text x="555" y="344" text-anchor="start" font-size="18">2. create transaction record</text>
<text x="555" y="368" text-anchor="start" font-size="18">(state = pending)</text>
<line x1="450" y1="500" x2="150" y2="500" stroke-dasharray="8,5" marker-end="url(#arrow)"/>
<text x="300.0" y="488" text-anchor="middle" font-size="18">3. transaction identifier</text>
<line x1="150" y1="600" x2="750" y2="600"  marker-end="url(#arrow)"/>
<text x="450.0" y="564" text-anchor="middle" font-size="18">4. request payment initiation</text>
<text x="450.0" y="588" text-anchor="middle" font-size="18">(transaction identifier)</text>
<line x1="750" y1="720" x2="1050" y2="720"  marker-end="url(#arrow)"/>
<text x="900.0" y="684" text-anchor="middle" font-size="18">5. invoke stock-reservation routine</text>
<text x="900.0" y="708" text-anchor="middle" font-size="18">[PHASE 1: ATOMIC RESERVATION]</text>
<path d="M1050,890 C 1140,884 1140,920 1050,916"  marker-end="url(#arrow)"/>
<text x="1155" y="806" text-anchor="start" font-size="18">6. attempt atomic reservation</text>
<text x="1155" y="830" text-anchor="start" font-size="18">procedure; on unavailability fall</text>
<text x="1155" y="854" text-anchor="start" font-size="18">back to a conditional update</text>
<text x="1155" y="878" text-anchor="start" font-size="18">guarded by the read quantity</text>
<line x1="1050" y1="1090" x2="750" y2="1090" stroke-dasharray="8,5" marker-end="url(#arrow)"/>
<text x="900.0" y="1078" text-anchor="middle" font-size="18">7. reservation result</text>
<line x1="750" y1="1180" x2="1350" y2="1180"  marker-end="url(#arrow)"/>
<text x="1050.0" y="1168" text-anchor="middle" font-size="18">8. initiate payment request</text>
<line x1="1350" y1="1270" x2="750" y2="1270" stroke-dasharray="8,5" marker-end="url(#arrow)"/>
<text x="1050.0" y="1258" text-anchor="middle" font-size="18">9. payment reference</text>
<path d="M750,1390 C 840,1384 840,1420 750,1416"  marker-end="url(#arrow)"/>
<text x="855" y="1330" text-anchor="start" font-size="18">10. create payment record</text>
<text x="855" y="1354" text-anchor="start" font-size="18">(state = pending,</text>
<text x="855" y="1378" text-anchor="start" font-size="18">gateway reference)</text>
<line x1="750" y1="1550" x2="150" y2="1550" stroke-dasharray="8,5" marker-end="url(#arrow)"/>
<text x="450.0" y="1538" text-anchor="middle" font-size="18">11. payment request accepted</text>
<line x1="1350" y1="1640" x2="750" y2="1640"  marker-end="url(#arrow)"/>
<text x="1050.0" y="1580" text-anchor="middle" font-size="18">12. asynchronous callback</text>
<text x="1050.0" y="1604" text-anchor="middle" font-size="18">[PHASE 2: RESOLUTION —</text>
<text x="1050.0" y="1628" text-anchor="middle" font-size="18">see FIG. 3]</text>
</g>
<text x="720.0" y="1950" text-anchor="middle" font-size="30" font-weight="bold">FIG. 2</text>
</svg>