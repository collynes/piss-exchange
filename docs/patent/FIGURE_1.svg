<svg viewBox="0 0 1450 1040" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1450" height="1040" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#000000"/>
    </marker>
  <style>text{stroke:none;fill:#000000;}</style></defs><text x="725.0" y="55" text-anchor="middle" font-size="27" font-weight="bold">FIGURE 1 — SYSTEM ARCHITECTURE OVERVIEW</text><g transform="translate(0,90)">
  <g stroke="#000000" stroke-width="2.5" fill="none" font-size="20">

    <!-- Client Application 102 -->
    <rect x="430" y="50" width="340" height="100" fill="#ffffff"/>
    <text x="600" y="90" text-anchor="middle" font-size="22" font-weight="bold">CLIENT APPLICATION</text>
    <text x="600" y="120" text-anchor="middle" font-size="20">102</text>

    <line x1="600" y1="150" x2="600" y2="228" marker-end="url(#arrow)"/>

    <!-- API Route Handlers 104 -->
    <rect x="390" y="230" width="420" height="100" fill="#ffffff"/>
    <text x="600" y="270" text-anchor="middle" font-size="22" font-weight="bold">API ROUTE HANDLERS</text>
    <text x="600" y="300" text-anchor="middle" font-size="20">104</text>

    <line x1="600" y1="330" x2="600" y2="408" marker-end="url(#arrow)"/>

    <!-- Database Layer 106 -->
    <rect x="360" y="410" width="480" height="130" fill="#ffffff"/>
    <text x="600" y="450" text-anchor="middle" font-size="22" font-weight="bold">DATABASE LAYER</text>
    <text x="600" y="478" text-anchor="middle" font-size="18">(RELATIONAL STORE WITH ROW-LEVEL</text>
    <text x="600" y="502" text-anchor="middle" font-size="18">SECURITY AND TRIGGER FUNCTIONS)</text>
    <text x="600" y="528" text-anchor="middle" font-size="20">106</text>

    <!-- side branch left: Payment Gateway Integration 108 -->
    <line x1="390" y1="280" x2="150" y2="280" marker-end="url(#arrow)"/>
    <rect x="20" y="230" width="280" height="100" fill="#ffffff"/>
    <text x="160" y="270" text-anchor="middle" font-size="20">PAYMENT GATEWAY</text>
    <text x="160" y="296" text-anchor="middle" font-size="20">INTEGRATION</text>
    <text x="160" y="322" text-anchor="middle" font-size="20">108</text>

    <line x1="160" y1="330" x2="160" y2="460"/>
    <line x1="160" y1="460" x2="358" y2="460" marker-end="url(#arrow)"/>
    <line x1="358" y1="480" x2="160" y2="480"/>
    <line x1="160" y1="480" x2="160" y2="330" marker-end="url(#arrow)"/>

    <!-- side branch right: Analytics Sinks 110 -->
    <line x1="810" y1="280" x2="1000" y2="280" marker-end="url(#arrow)"/>
    <rect x="1000" y="230" width="330" height="100" fill="#ffffff"/>
    <text x="1165" y="270" text-anchor="middle" font-size="22" font-weight="bold">ANALYTICS SINKS</text>
    <text x="1165" y="296" text-anchor="middle" font-size="16">(EXTERNAL + LOCAL LOG STORE)</text>
    <text x="1165" y="322" text-anchor="middle" font-size="20">110</text>

    <!-- domain records inside DB, shown as sub-box -->
    <rect x="410" y="550" width="380" height="90" fill="#ffffff"/>
    <text x="600" y="580" text-anchor="middle" font-size="16">CATALOG, OFFER, BID AND</text>
    <text x="600" y="604" text-anchor="middle" font-size="16">TRANSACTION RECORDS</text>
    <text x="600" y="628" text-anchor="middle" font-size="16">112</text>
    <line x1="600" y1="540" x2="600" y2="548"/>

    <!-- Realtime channel from DB back up to Client -->
    <line x1="840" y1="460" x2="1390" y2="460"/>
    <line x1="1390" y1="460" x2="1390" y2="100" marker-end="url(#arrow)"/>
    <line x1="1390" y1="100" x2="772" y2="100"/>
    <text x="1420" y="280" font-size="18" transform="rotate(90 1420 280)">REAL-TIME SUBSCRIPTION CHANNEL 114</text>

    <!-- Notification Gateway 116 -->
    <line x1="810" y1="315" x2="930" y2="315"/>
    <line x1="930" y1="315" x2="930" y2="580"/>
    <line x1="930" y1="580" x2="1000" y2="580" marker-end="url(#arrow)"/>
    <rect x="1000" y="520" width="330" height="120" fill="#ffffff"/>
    <text x="1165" y="560" text-anchor="middle" font-size="22" font-weight="bold">NOTIFICATION GATEWAY</text>
    <text x="1165" y="588" text-anchor="middle" font-size="16">(SMS PROVIDER)</text>
    <text x="1165" y="620" text-anchor="middle" font-size="20">116</text>

  </g>
  <text x="600" y="900" text-anchor="middle" font-size="30" font-weight="bold">FIG. 1</text>
</g></svg>