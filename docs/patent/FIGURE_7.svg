<svg viewBox="0 0 1650 2190" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1650" height="2190" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#000000"/>
    </marker>
  <style>text{stroke:none;fill:#000000;}</style></defs><text x="825.0" y="55" text-anchor="middle" font-size="27" font-weight="bold">FIGURE 7 — RPC-FIRST / OPTIMISTIC-LOCKING FALLBACK PATHWAY FOR INVENTORY MANAGEMENT</text><g transform="translate(0,90)">
  <g stroke="#000000" stroke-width="2.5" fill="none" font-size="19">

    <!-- 700 entry -->
    <rect x="470" y="30" width="480" height="110" rx="45" ry="45" fill="#ffffff"/>
    <text x="710" y="75" text-anchor="middle" font-size="20">reserveOrderStock(orderId)</text>
    <text x="710" y="105" text-anchor="middle" font-size="20">INVOKED   700</text>
    <line x1="710" y1="140" x2="710" y2="198" marker-end="url(#arrow)"/>

    <!-- 702 attempt RPC -->
    <rect x="430" y="200" width="560" height="100" fill="#ffffff"/>
    <text x="710" y="240" text-anchor="middle" font-size="20">ATTEMPT ATOMIC STOCK-RESERVATION</text>
    <text x="710" y="270" text-anchor="middle" font-size="20">PROCEDURE CALL   702</text>
    <line x1="710" y1="300" x2="710" y2="358" marker-end="url(#arrow)"/>

    <!-- 704 decision: error present? -->
    <polygon points="710,360 900,460 710,560 520,460" fill="#ffffff"/>
    <text x="710" y="445" text-anchor="middle" font-size="18">PROCEDURE RETURNED</text>
    <text x="710" y="475" text-anchor="middle" font-size="18">AN ERROR?</text>
    <text x="710" y="505" text-anchor="middle" font-size="17">704</text>

    <!-- NO branch: RPC succeeded -->
    <line x1="710" y1="560" x2="710" y2="618" marker-end="url(#arrow)"/>
    <text x="735" y="592" font-size="18">NO</text>
    <rect x="430" y="620" width="560" height="100" fill="#ffffff"/>
    <text x="710" y="660" text-anchor="middle" font-size="19">PROCEDURE PERFORMED ATOMIC</text>
    <text x="710" y="690" text-anchor="middle" font-size="19">DECREMENT IN ONE STATEMENT   706</text>
    <line x1="710" y1="720" x2="710" y2="1850" marker-end="url(#arrow)"/>

    <!-- YES branch: error present -->
    <line x1="900" y1="460" x2="1020" y2="460" marker-end="url(#arrow)"/>
    <text x="960" y="440" text-anchor="middle" font-size="18">YES</text>

    <!-- 708 decision: is missing-function error? -->
    <polygon points="1220,390 1420,460 1220,530 1020,460" fill="#ffffff"/>
    <text x="1220" y="430" text-anchor="middle" font-size="17">IS THE FAILURE DUE TO</text>
    <text x="1220" y="458" text-anchor="middle" font-size="17">PROCEDURE UNAVAILABILITY</text>
    <text x="1220" y="486" text-anchor="middle" font-size="17">(NOT YET DEPLOYED)?</text>
    <text x="1220" y="514" text-anchor="middle" font-size="16">708</text>

    <!-- NO branch of 708: real error, propagate -->
    <line x1="1220" y1="530" x2="1220" y2="588" marker-end="url(#arrow)"/>
    <text x="1245" y="562" font-size="18">NO</text>
    <rect x="1020" y="590" width="400" height="90" fill="#ffffff"/>
    <text x="1220" y="628" text-anchor="middle" font-size="18">RETURN { error: message }</text>
    <text x="1220" y="656" text-anchor="middle" font-size="18">TO CALLER   710</text>

    <!-- YES branch of 708: fallback -->
    <line x1="1420" y1="460" x2="1560" y2="460"/>
    <line x1="1560" y1="460" x2="1560" y2="800" marker-end="url(#arrow)"/>
    <text x="1480" y="440" text-anchor="middle" font-size="18">YES</text>

    <!-- 712 fallback path start -->
    <rect x="1200" y="802" width="400" height="100" fill="#ffffff"/>
    <text x="1400" y="842" text-anchor="middle" font-size="18">FALL BACK TO OPTIMISTIC-</text>
    <text x="1400" y="872" text-anchor="middle" font-size="18">LOCKING PATHWAY   712</text>
    <line x1="1400" y1="902" x2="1400" y2="960" marker-end="url(#arrow)"/>

    <!-- 714 read listing -->
    <rect x="1150" y="962" width="500" height="100" fill="#ffffff"/>
    <text x="1400" y="1000" text-anchor="middle" font-size="18">READ THE OFFER'S CURRENT AVAILABLE</text>
    <text x="1400" y="1030" text-anchor="middle" font-size="18">QUANTITY AND STATUS   714</text>
    <line x1="1400" y1="1062" x2="1400" y2="1120" marker-end="url(#arrow)"/>

    <!-- 716 conditional UPDATE with row match -->
    <rect x="1120" y="1122" width="560" height="220" fill="#ffffff"/>
    <text x="1400" y="1158" text-anchor="middle" font-weight="bold" font-size="19">CONDITIONAL UPDATE   716</text>
    <text x="1400" y="1190" text-anchor="middle" font-size="17">decrement available quantity by the</text>
    <text x="1400" y="1218" text-anchor="middle" font-size="17">requested amount, guarded by a condition</text>
    <text x="1400" y="1246" text-anchor="middle" font-size="17">requiring the quantity to still equal the</text>
    <text x="1400" y="1274" text-anchor="middle" font-size="17">value just read and the offer to remain</text>
    <text x="1400" y="1302" text-anchor="middle" font-size="17">available</text>
    <line x1="1400" y1="1342" x2="1400" y2="1400" marker-end="url(#arrow)"/>

    <!-- 718 decision: row updated? -->
    <polygon points="1400,1402 1600,1500 1400,1598 1200,1500" fill="#ffffff"/>
    <text x="1400" y="1478" text-anchor="middle" font-size="17">DID THE UPDATE MATCH A</text>
    <text x="1400" y="1506" text-anchor="middle" font-size="17">RECORD (QUANTITY UNCHANGED</text>
    <text x="1400" y="1534" text-anchor="middle" font-size="17">SINCE READ)?</text>
    <text x="1400" y="1562" text-anchor="middle" font-size="16">718</text>

    <!-- NO branch of 718: lost race, retry required -->
    <line x1="1200" y1="1500" x2="1000" y2="1500" marker-end="url(#arrow)"/>
    <text x="1100" y="1480" text-anchor="middle" font-size="18">NO</text>
    <rect x="740" y="1455" width="260" height="90" fill="#ffffff"/>
    <text x="870" y="1490" text-anchor="middle" font-size="17">RETURN "Stock changed</text>
    <text x="870" y="1518" text-anchor="middle" font-size="17">while processing"   720</text>

    <!-- YES branch of 718 -->
    <line x1="1400" y1="1598" x2="1400" y2="1656" marker-end="url(#arrow)"/>
    <text x="1425" y="1630" text-anchor="middle" font-size="18">YES</text>
    <rect x="1150" y="1658" width="500" height="100" fill="#ffffff"/>
    <text x="1400" y="1696" text-anchor="middle" font-size="18">RESERVATION SUCCEEDS —</text>
    <text x="1400" y="1726" text-anchor="middle" font-size="18">EQUIVALENT TO RPC OUTCOME   722</text>
    <line x1="1400" y1="1758" x2="900" y2="1850" marker-end="url(#arrow)"/>

    <!-- 724 unify -->
    <rect x="470" y="1852" width="480" height="100" fill="#ffffff"/>
    <text x="710" y="1892" text-anchor="middle" font-size="18">ORDER PROCEEDS TO PAYMENT</text>
    <text x="710" y="1922" text-anchor="middle" font-size="18">INITIATION (FIG. 2)   724</text>

  </g>
  <text x="825" y="2050" text-anchor="middle" font-size="30" font-weight="bold">FIG. 7</text>
</g></svg>