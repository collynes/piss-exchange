<svg viewBox="0 0 1440 1930" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1440" height="1930" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#000000"/>
    </marker>
    <style>text{stroke:none;fill:#000000;}</style>
  </defs>

<text x="720.0" y="55" text-anchor="middle" font-size="27" font-weight="bold">FIGURE 3 — M-PESA CALLBACK AUTHENTICATION AND IDEMPOTENCY CONTROL</text>
<g stroke="#000000" stroke-width="2.5" fill="none" font-size="18">
<rect x="90.0" y="130" width="260" height="92" fill="#ffffff" stroke-width="2.5"/>
<text x="220" y="160" text-anchor="middle" font-weight="bold" font-size="20">PAYMENT</text>
<text x="220" y="186" text-anchor="middle" font-weight="bold" font-size="20">GATEWAY</text>
<text x="220" y="216" text-anchor="middle" font-size="18">300</text>
<line x1="220" y1="222" x2="220" y2="1860" stroke-dasharray="7,5" stroke-width="2"/>
<rect x="590.0" y="130" width="260" height="92" fill="#ffffff" stroke-width="2.5"/>
<text x="720" y="160" text-anchor="middle" font-weight="bold" font-size="20">CALLBACK</text>
<text x="720" y="186" text-anchor="middle" font-weight="bold" font-size="20">API ROUTE</text>
<text x="720" y="216" text-anchor="middle" font-size="18">302</text>
<line x1="720" y1="222" x2="720" y2="1860" stroke-dasharray="7,5" stroke-width="2"/>
<rect x="1090.0" y="130" width="260" height="118" fill="#ffffff" stroke-width="2.5"/>
<text x="1220" y="160" text-anchor="middle" font-weight="bold" font-size="20">DATABASE</text>
<text x="1220" y="186" text-anchor="middle" font-weight="bold" font-size="20">(TRANSACTION AND</text>
<text x="1220" y="212" text-anchor="middle" font-weight="bold" font-size="20">SETTLEMENT RECORDS)</text>
<text x="1220" y="242" text-anchor="middle" font-size="18">304</text>
<line x1="1220" y1="248" x2="1220" y2="1860" stroke-dasharray="7,5" stroke-width="2"/>
<rect x="90" y="345" width="1260" height="125" stroke-dasharray="8,5" stroke-width="2"/>
<text x="102" y="371" font-size="17" font-style="italic">C1: shared-secret authentication</text>
<rect x="90" y="820" width="1260" height="130" stroke-dasharray="8,5" stroke-width="2"/>
<text x="102" y="846" font-size="17" font-style="italic">C2: idempotency guard</text>
<rect x="90" y="1155" width="1260" height="425" stroke-dasharray="8,5" stroke-width="2"/>
<text x="102" y="1181" font-size="17" font-style="italic">alt [success / failure]</text>
<line x1="220" y1="300" x2="720" y2="300"  marker-end="url(#arrow)"/>
<text x="470.0" y="264" text-anchor="middle" font-size="18">1. POST callback</text>
<text x="470.0" y="288" text-anchor="middle" font-size="18">(callback URL bearing a shared secret)</text>
<path d="M720,400 C 810,394 810,430 720,426"  marker-end="url(#arrow)"/>
<text x="825" y="364" text-anchor="start" font-size="18">2. AUTHENTICATION CHECK:</text>
<text x="825" y="388" text-anchor="start" font-size="18">does the secret match?</text>
<line x1="720" y1="550" x2="220" y2="550" stroke-dasharray="8,5" marker-end="url(#arrow)"/>
<text x="470.0" y="514" text-anchor="middle" font-size="18">3a. NO → accepted response,</text>
<text x="470.0" y="538" text-anchor="middle" font-size="18">(silently accepted, no state change)</text>
<line x1="720" y1="650" x2="1220" y2="650"  marker-end="url(#arrow)"/>
<text x="970.0" y="614" text-anchor="middle" font-size="18">3b. YES → look up the payment</text>
<text x="970.0" y="638" text-anchor="middle" font-size="18">record by gateway reference</text>
<line x1="1220" y1="780" x2="720" y2="780" stroke-dasharray="8,5" marker-end="url(#arrow)"/>
<text x="970.0" y="744" text-anchor="middle" font-size="18">4. payment record</text>
<text x="970.0" y="768" text-anchor="middle" font-size="18">(identifier, transaction, state)</text>
<path d="M720,880 C 810,874 810,910 720,906"  marker-end="url(#arrow)"/>
<text x="825" y="844" text-anchor="start" font-size="18">5. IDEMPOTENCY CHECK:</text>
<text x="825" y="868" text-anchor="start" font-size="18">is the record still pending?</text>
<line x1="720" y1="1030" x2="220" y2="1030" stroke-dasharray="8,5" marker-end="url(#arrow)"/>
<text x="470.0" y="994" text-anchor="middle" font-size="18">6a. ALREADY PROCESSED →</text>
<text x="470.0" y="1018" text-anchor="middle" font-size="18">accepted response (duplicate retry ignored)</text>
<line x1="720" y1="1130" x2="1220" y2="1130"  marker-end="url(#arrow)"/>
<text x="970.0" y="1094" text-anchor="middle" font-size="18">6b. NOT YET PROCESSED —</text>
<text x="970.0" y="1118" text-anchor="middle" font-size="18">branch on payment outcome</text>
<line x1="720" y1="1230" x2="1220" y2="1230"  marker-end="url(#arrow)"/>
<text x="970.0" y="1170" text-anchor="middle" font-size="18">7a. success → mark payment</text>
<text x="970.0" y="1194" text-anchor="middle" font-size="18">complete; advance transaction</text>
<text x="970.0" y="1218" text-anchor="middle" font-size="18">to paid state</text>
<line x1="720" y1="1410" x2="1220" y2="1410"  marker-end="url(#arrow)"/>
<text x="970.0" y="1350" text-anchor="middle" font-size="18">7b. failure → release reserved stock;</text>
<text x="970.0" y="1374" text-anchor="middle" font-size="18">mark payment failed;</text>
<text x="970.0" y="1398" text-anchor="middle" font-size="18">cancel the transaction</text>
<line x1="720" y1="1660" x2="220" y2="1660" stroke-dasharray="8,5" marker-end="url(#arrow)"/>
<text x="470.0" y="1648" text-anchor="middle" font-size="18">8. accepted response</text>
</g>
<text x="720.0" y="1900" text-anchor="middle" font-size="30" font-weight="bold">FIG. 3</text>
</svg>